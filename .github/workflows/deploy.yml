name: Deploy to GitHub Pages

# Builds the prototype and publishes it to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, and queue only the latest one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # A project site is served from https://<owner>.github.io/<repo-name>/, so the Vite
          # base path is the repository name.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Used by the exported 9 AM email previews for their "Open brief" link.
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Optional repository variable. When it is not set, the site has no API endpoint and
          # the talking-points chat runs offline. No API key is ever part of this build.
          VITE_AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
